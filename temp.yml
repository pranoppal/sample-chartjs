version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"  # Default RabbitMQ port
      - "15672:15672"  # Management UI port
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  backend:
    build:
      context: ./backend  # Path to your Spring Boot backend code
    container_name: spring-boot-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://<your-azure-sql-server>.database.windows.net;databaseName=<your-database>"
      SPRING_DATASOURCE_USERNAME: "<your-username>"
      SPRING_DATASOURCE_PASSWORD: "<your-password>"
      RABBITMQ_HOST: "rabbitmq"
    depends_on:
      - rabbitmq

  frontend:
    build:
      context: ./frontend  # Path to your React frontend code
    container_name: react-frontend
    ports:
      - "3000:3000"
